<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mapa Logístico de Escolas - Zona 47</title>
    
    <!-- CSS do Leaflet para renderizar o mapa -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Tailwind CSS para estilização moderna e responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fontes do Google -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            font-family: 'Inter', sans-serif; 
            background-color: #f8fafc;
            overflow: hidden; /* Evita scroll na janela principal */
        }
        
        /* Personalização do scrollbar para a lista de escolas */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }

        /* Estilização dos Popups do Leaflet para combinar com o tema */
        .leaflet-popup-content-wrapper {
            border-radius: 0.75rem;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            padding: 0;
        }
        .leaflet-popup-content {
            margin: 0;
            line-height: 1.5;
        }
        .leaflet-popup-tip-container {
            margin-top: -1px;
        }
        
        /* Correção para o z-index do Leaflet não se sobrepor à UI */
        .leaflet-top, .leaflet-bottom {
            z-index: 40 !important;
        }
    </style>
</head>
<body class="flex flex-col md:flex-row h-screen w-screen">

    <!-- Barra Lateral (Sidebar) com Pesquisa e Lista -->
    <aside class="w-full md:w-96 h-[45vh] md:h-screen bg-white shadow-2xl flex flex-col z-50 relative border-t md:border-t-0 md:border-r border-slate-200 order-2 md:order-1 transition-all">
        <!-- Cabeçalho da Sidebar -->
        <div class="p-5 border-b border-slate-100 bg-white z-10 flex-shrink-0 shadow-sm">
            <h1 class="text-2xl font-bold text-slate-800 flex items-center gap-2">
                <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                </svg>
                Zona 47
            </h1>
            <p class="text-sm text-slate-500 mt-1 mb-4">São José de Ribamar - Escolas</p>
            
            <!-- Barra de Pesquisa -->
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
                <input type="text" id="searchInput" placeholder="Pesquisar escola..." class="w-full pl-10 pr-4 py-2.5 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-sm bg-slate-50">
            </div>
        </div>

        <!-- Lista de Escolas -->
        <div class="flex-1 overflow-y-auto p-3 space-y-2 bg-slate-50" id="schoolList">
            <!-- Os itens serão gerados via JavaScript -->
        </div>

        <!-- Botão de Localização do Utilizador -->
        <div class="p-4 border-t border-slate-200 bg-white flex-shrink-0">
            <button id="locateMeBtn" class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-medium py-2.5 px-4 rounded-lg transition-colors shadow-sm flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
                Encontrar Minha Localização
            </button>
            <div id="locationStatus" class="text-xs text-center text-red-500 mt-2 hidden"></div>
        </div>
    </aside>

    <!-- Contentor do Mapa -->
    <main id="map" class="flex-1 z-10 order-1 md:order-2 h-[55vh] md:h-screen w-full bg-slate-200"></main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // Inicializa o mapa centralizado na região de São José de Ribamar
            const map = L.map('map', {
                zoomControl: false // Vamos reposicionar o controlo de zoom
            }).setView([-2.5600, -44.0500], 12);

            // Adiciona controlo de zoom no canto superior direito para não sobrepor a UI mobile
            L.control.zoom({ position: 'topright' }).addTo(map);

            // Adiciona a camada de mapa usando CARTO Voyager (evita bloqueio 403 do servidor padrão do OSM)
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contribs &copy; <a href="https://carto.com/attributions">CARTO</a>'
            }).addTo(map);

            // Ícones customizados usando HTML e Tailwind (divIcon)
            function getSchoolIcon(isVisited = false) {
                // Se visitada, usamos tons de verde (emerald), senão usamos o azul padrão
                const baseColor = isVisited ? 'bg-emerald-600' : 'bg-blue-600';
                const blurColor = isVisited ? 'bg-emerald-500' : 'bg-blue-500';
                
                // SVG muda dependendo do estado (check para visitado, chapéu para não visitado)
                const svgPath = isVisited 
                    ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />' 
                    : '<path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72l5 2.73 5-2.73v3.72z"/>';
                
                const svgClass = isVisited ? 'w-5 h-5' : 'w-4 h-4';
                const svgFill = isVisited ? 'none' : 'currentColor';
                const svgStroke = isVisited ? 'currentColor' : 'none';

                return L.divIcon({
                    className: 'bg-transparent',
                    html: `
                        <div class="relative group cursor-pointer">
                            <div class="absolute -inset-1 ${blurColor} rounded-full blur opacity-40 group-hover:opacity-100 transition duration-200"></div>
                            <div class="relative ${baseColor} text-white rounded-full w-8 h-8 flex items-center justify-center shadow-lg border-2 border-white transform transition-transform duration-200 group-hover:scale-110">
                                <svg class="${svgClass}" fill="${svgFill}" stroke="${svgStroke}" viewBox="0 0 24 24">
                                    ${svgPath}
                                </svg>
                            </div>
                        </div>
                    `,
                    iconSize: [32, 32],
                    iconAnchor: [16, 16],
                    popupAnchor: [0, -16]
                });
            }

            const userIcon = L.divIcon({
                className: 'bg-transparent',
                html: `
                    <div class="relative flex h-8 w-8 items-center justify-center">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-4 w-4 bg-red-600 border-2 border-white shadow"></span>
                    </div>
                `,
                iconSize: [32, 32],
                iconAnchor: [16, 16],
                popupAnchor: [0, -16]
            });

            let userMarker = null;
            let watchId = null;

            const escolasBase = [
                { nome: "ESCOLA MUNICIPAL GONÇALVES DIAS", endereco: "AV. PARAÍSO, N 16/17. JARDIM TROPICAL II-ZONA URBANA SÃO JOSÉ DE RIBAMAR 65110000" },
                { nome: "ESCOLA MUNICIPAL SÃO FRANCISCO", endereco: "RUA SANTA MARIA, 65, MAIOBINHA - ZONA URBANA, SÃO JOSÉ DE RIBAMAR 65110000" },
                { nome: "ESCOLA MUNICIPAL HUMBERTO DE CAMPOS", endereco: "AVENIDA GONALVES DIAS, 870, CENTRO CENTRO-ZONA URBANA SÃO JOSÉ DE RIBAMAR-65110000" },
                { nome: "ESCOLA MUNICIPAL SANTA MARIA", endereco: "RUA PRINCIPAL, S/N, POVOADO SANTA MARIA - ZONA RURAL SÃO 65110000 JOSE DE RIBAMAR" },
                { nome: "ESCOLA MUNICIPAL LICEU RIBAMARENSE", endereco: "ESTRADA DE RIBAMAR, S/N, MIRITITIUA-ZONA RURAL, SÃO JOSÉ DE RIBAMAR-65110000" },
                { nome: "ESCOLA MUNICIPAL MENINO JESUS", endereco: "RUA SAO PEDRO 90, ITAPIRACO-ZONA RURAL, SÃO JOSÉ DE RIBAMAR-65110000" },
                { nome: "ESCOLA MUNICIPAL SÃO RAIMUNDO", endereco: "RUA GETULIO VARGAS, SN, SAO RAIMUNDO-ZONA URBANA, SÃO 65110000 JOSE DE RIBAMAR" },
                { nome: "ESCOLA MUNICIPAL SANTO ANTONIO", endereco: "ESTRADA DO PANAQUATIRA, PANAQUATIRA - ZONA RURAL, SÃO JOSE DE RIBAMAR 65110000" },
                { nome: "UNIDADE INTEGRADA SARNEY FILHO", endereco: "AVENIDA 02, S/N, VILA SARNEY FILHO I-ZONA URBANA, SÃO JOSÉ DE RIBAMAR-65000000" },
                { nome: "CE PROFESSOR LUIS REGO", endereco: "RUA SANTA INES, SN, JARDIM TROPICALI-ZONA URBANA, SÃO JOSÉ DE RIBAMAR 65100000" },
                { nome: "CENTRO EDUCA MAIS SALUSTIANO TRINDADE", endereco: "AVENIDA TRINDADE SN, MATINHA - ZONA RURAL, SÃO JOSÉ DE RIBAMAR-65110000" },
                { nome: "COLEGIO MARISTA ARACAGY", endereco: "ESTRADA DO ARACAGY 48, ARACAGY-ZONA URBANA, SÃO JOSÉ DE RIBAMAR-65110000" },
                { nome: "ESCOLA MUNICIPAL PARQUE VITORIA", endereco: "PRAÇA DO RODÃO N. 12. PARQUE VITORIA-ZONA URBANA, SÃO JOSE DE RIBAMAR 65110000" },
                { nome: "UNIDADE INTEGRADA DIOMEDES PEREIRA", endereco: "RUA DO FIO S/N, J. CAMARA-ZONA URBANA, SÃO JOSÉ DE RIBAMAR-65110000" },
                { nome: "CENTRO DE ENSINO POETA CUNHA SANTOS", endereco: "ESTRADA DA VITÓRIA SAN, RESIDENCIAL CANUDOS-ZONA RURAL SÃO JOSÉ DE RIBAMAR-65110000" },
                { nome: "ESCOLA MUNICIPAL MARLY SARNEY", endereco: "AVENIDA PRINCIPAL, SN, MAIOBINHA-ZONA URBANA, SÃO JOSÉ DE RIBAMAR - 65110000" },
                { nome: "ESCOLA MUNICIPAL PROFESSORA MARIA ELISA ALMEIDA SILVA", endereco: "RUA 28 DE JULHO, 780, CENTRO-ZONA URBANA, SÃO JOSÉ DE RIBAMAR-65110000." },
                { nome: "ESCOLA MUNICIPAL SAO FRANCISCO DE ASSIS", endereco: "RUA DAS FLORES S/N, J. CAMARA-ZONA URBANA SÃO JOSÉ DE RIBAMAR-65110000" },
                { nome: "ESCOLA MUNICIPAL SAO JOSE DE RIBAMAR", endereco: "RUA 14, SN, J. LIMA-ZONA URBANA, SÃO JOSÉ DE RIBAMAR- 65110000" },
                { nome: "COLÉGIO MILITAR 2 DE JULHO XIII - ESTADO DA GUANABARA", endereco: "RUA 28 DE JULHO, 99, CENTRO, CENTRO-ZONA URBANA, SÃO JOSÉ DE RIBAMAR 65110009" },
                { nome: "CRECHE NOVA TERRA", endereco: "RUA SIGNO DE ARIES, S/N, RESIDENCIAL NOVA TERRA, SÃO JOSÉ DE RIBAMAR-65110000" },
                { nome: "ESCOLA EDUCANDO", endereco: "AV CN 17, QUADRA 13 SITIO TRIZIDELA ARAÇAGY III, JARDIM ARACAGY-ZONA URBANA, SÃO JOSÉ DE RIBAMAR-65110000" },
                { nome: "ESCOLA MUNICIPAL DA VILA OPERARIA", endereco: "RUA 2, VILA OPERARIA - ZONA URBANA, SÃO JOSÉ DE RIBAMAR - 65110000" },
                { nome: "ESCOLA MUNICIPAL DO ALTO DO TURU", endereco: "AV 01, QUADRA 27, S/N, ALTO DO TURU 1-ZONA URBANA, SÃO JOSÉ DE RIBAMAR-65110000" },
                { nome: "ESCOLA MUNICIPAL LICEU RIBAMARENSE II", endereco: "RUA KENIA CRISTINA S/N, PARQUE JAIR - ZONA RURAL, SÃO JOSÉ DE RIBAMAR-65110000" },
                { nome: "ESCOLA MUNICIPAL OLAVO BILAC", endereco: "RUA C, CASA 33, VILA CAFETEIRA - ZONA URBANA, SÃO JOSÉ DE RIBAMAR 65110000" },
                { nome: "ESCOLA MUNICIPAL PROFA LEDA CHAVES TAJRA", endereco: "RUA GETULIO VARGAS S/N, SAO RAIMUNDO-ZONA URBANA, SÃO JOSÉ DE RIBAMAR 65110000" },
                { nome: "ESCOLA MUNICIPAL JOSE FERNANDES MACHADO", endereco: "AVENIDA ALAMEDA GRAJAU, 01. JARDIM TROPICALI-ZONA URBANA, SÃO JOSÉ DE RIBAMAR 65110000" },
                { nome: "ESCOLA MUNICIPAL JOSE GREGORIO BOTAO", endereco: "RUA PRINCIPAL S/N, VILA DR. JULINHO VILA DR JULINHO-ZONA. URBANA, SÃO JOSÉ DE RIBAMAR-65110000" },
                { nome: "INSTITUTO ESTADUAL DE EDUCAÇÃO, CIENCIA E TECNOLOGIA DO MARANHÃO-IEMA", endereco: "AVENIDA PANAQUATIRA S/N J. CAMARA-ZONA URBANA, SÃO JOSE DE RIBAMAR 65110000" },
                { nome: "UNIDADE ESCOLAR SAO JOSE DOS INDIOS", endereco: "RUA PRINCIPAL S/N SAO JOSE DOS INDIOS - ZONA RURAL SÃO JOSÉ DE RIBAMAR 65110000" }
                // Truncado por brevidade, pode expandir conforme a lista original
            ];

            // Função para gerar valores "aleatórios" previsíveis (seeded) baseados num índice.
            // Isso previne que as escolas mudem de lugar a cada atualização de página.
            function seededRandom(seed) {
                const x = Math.sin(seed) * 10000;
                return x - Math.floor(x);
            }

            // Gera localizações persistentes ao redor do centro de São José de Ribamar
            const escolas = escolasBase.map((escola, index) => {
                const latOffset = (seededRandom(index + 1) - 0.5) * 0.12; 
                const lngOffset = (seededRandom(index + 100) - 0.5) * 0.12;
                
                return {
                    id: index,
                    ...escola,
                    lat: -2.5600 + latOffset,
                    lng: -44.0500 + lngOffset
                };
            });

            const markers = {}; // Armazena marcadores pela ID da escola para fácil acesso
            const listContainer = document.getElementById('schoolList');
            const searchInput = document.getElementById('searchInput');

            // Carrega as escolas já visitadas da memória do navegador (LocalStorage)
            let visitedSchools = JSON.parse(localStorage.getItem('visitedSchools')) || [];

            // Renderiza Marcadores no Mapa e Itens na Lista
            escolas.forEach(escola => {
                // Link Google Maps
                const urlRota = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(escola.endereco + ", São José de Ribamar, MA")}`;
                
                // Construção do Popup customizado
                const popupContent = `
                    <div class="p-4 w-64">
                        <div class="mb-3 text-center">
                            <div class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded inline-block mb-2">Escola</div>
                            <h3 class="font-bold text-slate-800 text-sm leading-tight">${escola.nome}</h3>
                        </div>
                        <p class="text-xs text-slate-500 text-center mb-4 line-clamp-3">${escola.endereco}</p>
                        <a href="${urlRota}" target="_blank" class="block w-full text-center bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-md transition-colors text-xs shadow-sm">
                            Iniciar Rota no GPS
                        </a>
                    </div>
                `;

                // Verifica se a escola já foi visitada
                const isVisited = visitedSchools.includes(escola.id);

                // Cria o marcador
                const marker = L.marker([escola.lat, escola.lng], {icon: getSchoolIcon(isVisited)})
                    .addTo(map)
                    .bindPopup(popupContent);
                
                markers[escola.id] = marker;

                // Cria o item na lista (Sidebar)
                const listItem = document.createElement('div');
                listItem.className = "bg-white p-3 rounded-lg border border-slate-200 shadow-sm hover:shadow-md hover:border-blue-300 transition-all cursor-pointer group school-item flex items-start gap-3";
                listItem.dataset.name = escola.nome.toLowerCase();
                listItem.dataset.id = escola.id;
                
                // Define o estilo inicial do texto consoante o estado
                const titleClass = isVisited ? 'line-through text-slate-400' : 'text-slate-800';
                
                listItem.innerHTML = `
                    <div class="pt-0.5" title="Marcar como concluída">
                        <input type="checkbox" class="w-4 h-4 text-emerald-600 bg-slate-100 border-slate-300 rounded focus:ring-emerald-500 cursor-pointer" ${isVisited ? 'checked' : ''}>
                    </div>
                    <div class="flex-1 overflow-hidden">
                        <h4 class="font-semibold text-sm group-hover:text-blue-600 transition-colors title-element ${titleClass}">${escola.nome}</h4>
                        <p class="text-xs text-slate-500 mt-1 truncate" title="${escola.endereco}">${escola.endereco}</p>
                    </div>
                `;
                
                // Evento ao clicar na lista: Move o mapa e abre o popup
                listItem.addEventListener('click', (e) => {
                    // Impede o redirecionamento/zoom do mapa se clicou propositadamente na caixa de seleção (checkbox)
                    if (e.target.tagName.toLowerCase() === 'input') {
                        const isChecked = e.target.checked;
                        
                        if (isChecked) {
                            visitedSchools.push(escola.id);
                        } else {
                            visitedSchools = visitedSchools.filter(id => id !== escola.id);
                        }
                        
                        // Salva imediatamente no LocalStorage do navegador
                        localStorage.setItem('visitedSchools', JSON.stringify(visitedSchools));
                        
                        // Atualiza a cor e o ícone do pino no mapa
                        marker.setIcon(getSchoolIcon(isChecked));
                        
                        // Atualiza a aparência visual do texto na lista (aplica ou remove o riscado)
                        const title = listItem.querySelector('.title-element');
                        if (isChecked) {
                            title.classList.add('line-through', 'text-slate-400');
                            title.classList.remove('text-slate-800');
                        } else {
                            title.classList.remove('line-through', 'text-slate-400');
                            title.classList.add('text-slate-800');
                        }
                        return; // Termina a função aqui para não abrir o popup do mapa
                    }

                    map.flyTo([escola.lat, escola.lng], 15, {
                        animate: true,
                        duration: 1.5
                    });
                    marker.openPopup();
                    
                    // No mobile, se clicar num item, deslizamos para cima para ver o mapa
                    if (window.innerWidth < 768) {
                        document.body.scrollTop = 0; // Para Safari
                        document.documentElement.scrollTop = 0; // Para Chrome, Firefox, IE e Opera
                    }
                });

                listContainer.appendChild(listItem);
            });

            // Criar uma cerca virtual (geofence) ao redor de todas as escolas
            const latitudes = escolas.map(e => e.lat);
            const longitudes = escolas.map(e => e.lng);
            
            const minLat = Math.min(...latitudes);
            const maxLat = Math.max(...latitudes);
            const minLng = Math.min(...longitudes);
            const maxLng = Math.max(...longitudes);
            
            // Margem em graus para a cerca não ficar a tocar nos marcadores externos
            const pad = 0.006; 
            
            // Definir os 4 cantos da nossa zona logística
            const cercaCoords = [
                [minLat - pad, minLng - pad], // Canto Sudoeste
                [maxLat + pad, minLng - pad], // Canto Noroeste
                [maxLat + pad, maxLng + pad], // Canto Nordeste
                [minLat - pad, maxLng + pad]  // Canto Sudeste
            ];
            
            // Desenhar a cerca no mapa
            const cercaVirtual = L.polygon(cercaCoords, {
                color: '#ef4444', // Cor vermelha para a borda (chama a atenção)
                weight: 3,        // Espessura da linha
                opacity: 0.8,
                fillColor: '#3b82f6', // Cor azul suave no interior
                fillOpacity: 0.05,    // Quase transparente para não esconder as ruas
                dashArray: '10, 10'   // Linha tracejada típica de cercas virtuais
            }).addTo(map)
            .bindPopup(`
                <div class="text-center p-2">
                    <b class="text-slate-800 text-sm">Zona 47</b>
                    <p class="text-xs text-slate-500 mt-1">Área Restrita de Logística Escolar</p>
                </div>
            `);

            // Ajustar o zoom inicial automaticamente para enquadrar a cerca completa
            map.fitBounds(cercaVirtual.getBounds(), { padding: [30, 30] });

            // Lógica da Barra de Pesquisa
            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                const items = document.querySelectorAll('.school-item');
                let foundCount = 0;

                items.forEach(item => {
                    if (item.dataset.name.includes(term)) {
                        item.style.display = 'block';
                        foundCount++;
                    } else {
                        item.style.display = 'none';
                    }
                });
                
                // Mensagem de "Nenhum resultado"
                let noResultMsg = document.getElementById('noResultMsg');
                if (foundCount === 0) {
                    if (!noResultMsg) {
                        noResultMsg = document.createElement('div');
                        noResultMsg.id = 'noResultMsg';
                        noResultMsg.className = 'p-4 text-center text-sm text-slate-500';
                        noResultMsg.innerText = 'Nenhuma escola encontrada com este nome.';
                        listContainer.appendChild(noResultMsg);
                    }
                } else if (noResultMsg) {
                    noResultMsg.remove();
                }
            });

            // Lógica de Geolocalização
            const locateBtn = document.getElementById('locateMeBtn');
            const statusDiv = document.getElementById('locationStatus');

            function showStatus(msg, isError = false) {
                statusDiv.innerText = msg;
                statusDiv.classList.remove('hidden');
                statusDiv.className = `text-xs text-center mt-2 ${isError ? 'text-red-500' : 'text-blue-500'}`;
            }

            locateBtn.addEventListener('click', () => {
                if (!('geolocation' in navigator)) {
                    showStatus('Geolocalização não suportada pelo navegador.', true);
                    return;
                }

                locateBtn.innerHTML = `
                    <svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    A Localizar...
                `;
                
                if (watchId) {
                    navigator.geolocation.clearWatch(watchId);
                }

                watchId = navigator.geolocation.watchPosition(
                    position => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;

                        if (!userMarker) {
                            userMarker = L.marker([lat, lng], {icon: userIcon}).addTo(map)
                                .bindPopup(`
                                    <div class="text-center p-2">
                                        <b class="text-slate-800 text-sm">A Sua Posição</b>
                                    </div>
                                `).openPopup();
                        } else {
                            userMarker.setLatLng([lat, lng]);
                        }
                        
                        map.flyTo([lat, lng], 14, { duration: 1.5 });
                        
                        // Reset button UI
                        locateBtn.innerHTML = `
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            </svg>
                            Atualizar Minha Posição
                        `;
                        showStatus('Localização encontrada com sucesso.', false);
                    },
                    error => {
                        console.error("Erro de geolocalização: ", error);
                        let errMsg = "Não foi possível obter a sua localização.";
                        if (error.code === 1) errMsg = "Permissão de localização negada.";
                        if (error.code === 2) errMsg = "Posição de rede indisponível.";
                        if (error.code === 3) errMsg = "Tempo excedido ao tentar localizar.";
                        
                        showStatus(errMsg, true);
                        
                        // Reset button UI
                        locateBtn.innerHTML = `Tentar Novamente`;
                    }, 
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            });
        });
    </script>
</body>
</html>
